name: Deploy Mahad Next.js preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-mahad-next.yml"
      - "mahad-next/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mahad-next/package-lock.json

      - name: Install dependencies
        working-directory: mahad-next
        run: npm ci

      - name: Check types and lint
        working-directory: mahad-next
        run: |
          npm run typecheck
          npm run lint

      - name: Build static site
        working-directory: mahad-next
        env:
          NEXT_PUBLIC_BASE_PATH: /mahad
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: mahad-next/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
